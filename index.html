<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OSINT Report Builder</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">OSINT Report Builder</div>
    <input id="projectName" class="project-name" value="Новый отчёт" aria-label="Название проекта">
    <div class="top-actions">
      <span id="saveStatus" class="save-status">Сохранено</span>
      <button data-action="undo" title="Ctrl+Z">↶</button>
      <button data-action="redo" title="Ctrl+Y">↷</button>
      <button data-action="preview">Предпросмотр</button>
      <button class="primary" data-action="export">Экспорт в PDF</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar left">
      <div class="tabs">
        <button class="tab active" data-panel="pages">Страницы</button>
        <button class="tab" data-panel="insert">Элементы</button>
      </div>
      <section id="pagesPanel" class="panel active">
        <div class="panel-head"><b>Страницы</b><button data-action="addPage">+</button></div>
        <div id="pageList" class="page-list"></div>
      </section>
      <section id="insertPanel" class="panel">
        <div class="tool-grid">
          <button data-add="text">Текст</button>
          <button data-add="heading">Заголовок</button>
          <button data-add="image">Изображение</button>
          <button data-add="table">Таблица</button>
          <button data-add="source">Источник</button>
          <button data-add="timeline">Timeline</button>
          <button data-add="quote">Цитата</button>
          <button data-add="osint">OSINT-блок</button>
          <button data-add="qr">QR-код</button>
          <button data-add="line">Разделитель</button>
        </div>
        <div class="library-title">Шаблоны</div>
        <div class="templates">
          <button data-template="minimal">Минималистичный</button>
          <button data-template="analytic">Аналитический</button>
          <button data-template="geoint">GEOINT</button>
          <button data-template="dark">Тёмный</button>
        </div>
      </section>
    </aside>

    <section class="canvas-area">
      <div class="canvas-toolbar">
        <div>
          <button data-action="zoomOut">−</button>
          <span id="zoomLabel">85%</span>
          <button data-action="zoomIn">+</button>
          <button data-action="fit">По странице</button>
        </div>
        <div>
          <button data-action="grid">Сетка</button>
          <button data-action="fullscreen">Полный экран</button>
        </div>
      </div>
      <div id="canvasScroll">
        <div id="pageCanvas" class="page-canvas"></div>
      </div>
    </section>

    <aside class="sidebar right">
      <div class="right-head">Свойства</div>
      <div id="properties" class="properties">
        <div class="empty">Выберите объект на странице</div>
      </div>
    </aside>
  </main>
</div>

<div id="telegramPopup" class="telegram-popup">
  <button class="popup-close" aria-label="Закрыть">×</button>
  <div class="popup-title">Подпишитесь на наш Telegram-канал</div>
  <div class="popup-text">Обновления, материалы и новые инструменты.</div>
  <a class="popup-button" href="https://t.me/+HphbJWHr-Ag2MTFi" target="_blank" rel="noopener">Перейти в Telegram</a>
</div>

<div id="previewModal" class="modal hidden">
  <div class="modal-inner">
    <button class="modal-close">×</button>
    <div id="previewContent"></div>
  </div>
</div>

<nav class="mobile-nav"><button data-mobile="pages"><span>▤</span>Страницы</button><button data-mobile="insert"><span>＋</span>Добавить</button><button data-mobile="properties"><span>☷</span>Свойства</button><button data-action="preview"><span>◫</span>Просмотр</button></nav>
<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
<script src="app.js"></script>
</body>
</html>
